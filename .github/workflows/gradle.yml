# Builds both loader jars (Fabric + Forge) on every push and pull request to the
# 1.20.1-forge branch, and uploads them as a workflow artifact.
#
# Notes specific to this project:
# - It must run on JDK 21. The build sets `options.release = 21` and the mod uses
#   virtual threads, so the JDK 17 that GitHub's default Java workflow template
#   picks fails with `invalid source release: 21`.
# - `./gradlew build` is NOT enough: the root project has no aggregation build task
#   for the loaders, so the jar-producing tasks have to be named explicitly.
# - Tests are disabled in common/build.gradle and call the live NetEase API, so
#   they are not part of CI.
#
# There is deliberately no dependency-submission job: the Gradle one that GitHub's
# template generates fails with "The Dependency graph is disabled for this
# repository" here. Enable Settings -> Code security -> Dependency graph first, then
# add `gradle/actions/dependency-submission` back.

name: Build

on:
  push:
    branches: ["1.20.1-forge"]
  pull_request:
    branches: ["1.20.1-forge"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Fabric + Forge jars
        run: ./gradlew --no-daemon --console=plain :fabric:build :forge:build
        env:
          # build.gradle defaults this to a ghproxy.net mirror because raw.githubusercontent.com
          # is unreachable from the author's machine. CI can reach it directly, and the mirror
          # would only add a third-party dependency to the build.
          MUSICHUD_FUZS_REPO: https://raw.githubusercontent.com/Fuzss/modresources/main/maven/

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: music_hud-1.20.1
          path: |
            fabric/build/libs/music_hud-fabric-*.jar
            forge/build/libs/music_hud-forge-*.jar
            !fabric/build/libs/*-dev-shadow.jar
            !fabric/build/libs/*-sources.jar
            !forge/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
          # Only the remapped jars are downloads; -dev-shadow and -sources are intermediates.
          if-no-files-found: error
