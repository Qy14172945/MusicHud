plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false

        // See forge/build.gradle for the full explanation: slf4j-api's `Multi-Release: true`
        // manifest attribute is merged into the fat jar while its META-INF/versions/9 entry is
        // dropped by `exclude 'org/slf4j/**'`, producing a malformed multi-release jar. Forge's
        // SecureJar walks the missing META-INF/versions path and aborts the launch. The loader
        // provides slf4j anyway, so keep it out of the bundle on both platforms.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Forge Config Api Port for Fabric
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$rootProject.forge_config_api_port_version"

    modApi("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    // ModernUI Fabric
    modImplementation("icyllis.modernui:ModernUI-Fabric:1.20.1-${rootProject.modernui_version}.1")

    implementation "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    shadowBundle "com.github.umjammer:jlayer:$rootProject.jlayer_version"

    implementation "org.jflac:jflac-codec:$rootProject.jflac_version"
    shadowBundle "org.jflac:jflac-codec:$rootProject.jflac_version"

    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'org/slf4j/**'

    // Bundle jlayer under a private package. See forge/build.gradle for the full story: on Forge
    // every mod jar becomes a JPMS automatic module, and a pack that already bundles jlayer via
    // JarJar aborts the launch with
    //   ResolutionException: Modules music_hud and jlayer export package javazoom.jl.converter
    // Relocating keeps the MP3 decoder an implementation detail on both loaders, and also stops
    // our copy from shadowing another Fabric mod's jlayer on the shared classpath.
    relocate 'javazoom', 'indi.etern.musichud.shaded.javazoom'
    // `relocate` does not rewrite SPI registration files. On Forge the stale
    // `META-INF/services/javazoom.jl.player.AudioDeviceFactory` still declares a provider in the
    // original package, which makes the module keep claiming `javazoom.jl.player` and collide
    // with a JarJar-nested jlayer elsewhere in the pack. The `player` package is unused (only
    // `javazoom.jl.decoder` is), so drop it here too and keep both loaders byte-identical.
    exclude 'META-INF/services/javazoom.jl.player.AudioDeviceFactory'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

loom {
    runs {
        client {
            setRunDirectory file("run/client")
            jvmArguments.addAll(
                    "-Dmusichud.log.level=DEBUG"
            )
        }
        server {
            setRunDirectory file("run/server")
            jvmArguments.addAll(
                    "-Dmusichud.log.level=DEBUG"
            )
        }
    }
}