plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false

        // slf4j-api declares `Multi-Release: true` in its manifest (it ships
        // META-INF/versions/9/module-info.class). Shadow copies that attribute into the fat jar's
        // manifest while `exclude 'org/slf4j/**'` below drops the versioned entry, so the result
        // CLAIMS to be multi-release but has no META-INF/versions directory. Forge's SecureJar
        // then runs Files.walk(root.resolve("META-INF/versions")) during transformation-service
        // discovery and dies with a UnionFileSystem$NoSuchFileException: /META-INF/versions before
        // any mod loads. The game already provides slf4j, so keep it out of the bundle entirely.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // ModernUI Forge
    modImplementation("icyllis.modernui:ModernUI-Forge:1.20.1-${rootProject.modernui_version}.1")

    modImplementation("icyllis.modernui:ModernUI-Core:${rootProject.modernui_version}") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.apache.logging.log4j", module: "log4j-core"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.jetbrains", module: "annotations"
        exclude group: "com.ibm.icu", module: "icu4j"
        exclude group: "it.unimi.dsi", module: "fastutil"
    }

    modImplementation("icyllis.modernui:ModernUI-Markflow:$rootProject.modernui_version") {
        exclude group: "org.slf4j", module: "slf4j-api"
        exclude group: "org.apache.logging.log4j", module: "log4j-core"
        exclude group: "org.apache.logging.log4j", module: "log4j-api"
        exclude group: "com.google.code.findbugs", module: "jsr305"
        exclude group: "org.jetbrains", module: "annotations"
        exclude group: "com.ibm.icu", module: "icu4j"
        exclude group: "it.unimi.dsi", module: "fastutil"
        exclude group: "org.commonmark"
    }

    implementation "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    shadowBundle "com.github.umjammer:jlayer:$rootProject.jlayer_version"
    forgeRuntimeLibrary "com.github.umjammer:jlayer:$rootProject.jlayer_version"

    implementation "org.jflac:jflac-codec:$rootProject.jflac_version"
    shadowBundle "org.jflac:jflac-codec:$rootProject.jflac_version"
    forgeRuntimeLibrary "org.jflac:jflac-codec:$rootProject.jflac_version"

    implementation "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"
    forgeRuntimeLibrary "com.github.hypfvieh:dbus-java-core:$rootProject.dbus_version"

    implementation "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    shadowBundle "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
    forgeRuntimeLibrary "com.github.hypfvieh:dbus-java-transport-native-unixsocket:$rootProject.dbus_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    exclude 'org/slf4j/**'

    // Forge runs every mod jar as a JPMS automatic module, so a mod may not export a package
    // that another module already exports. Other mods bundle jlayer through JarJar -- e.g.
    // hqspeaker ships `META-INF/jarjar/jlayer-1.0.1.4.jar`, which ModLauncher materialises as
    // the automatic module `jlayer`. Our fat jar is itself the automatic module `music_hud`,
    // so shipping jlayer's classes unrelocated makes both modules export
    // `javazoom.jl.converter` and the game dies before any mod loads with:
    //   java.lang.module.ResolutionException: Modules music_hud and jlayer export package
    //   javazoom.jl.converter to module <other>
    // Relocating into a private namespace keeps the MP3 decoder an implementation detail.
    // (The dev runs do not hit this: there jlayer sits on the classpath as its own jar via
    // `forgeRuntimeLibrary`, so only one module ever contributes the package.)
    //
    // `relocate` rewrites the classes but NOT jlayer's SPI registration file, and that is what
    // actually breaks the module layer: `META-INF/services/javazoom.jl.player.AudioDeviceFactory`
    // keeps its original name and still lists `javazoom.jl.player.JavaSoundAudioDeviceFactory`.
    // JPMS derives a `provides` directive from every `META-INF/services/*` entry, so the module
    // still claims package `javazoom.jl.player` even though the classes moved -- the exact same
    // `ResolutionException`, one package over, plus a failed module derivation:
    //   InvalidModuleDescriptorException: Provider class
    //   javazoom.jl.player.JavaSoundAudioDeviceFactory not in JAR file
    // The `player` package is never used (only `javazoom.jl.decoder` is: `MP3StreamDecoder`
    // decodes to PCM itself and never touches jlayer's audio-device/Player layer), so the stale
    // registration is simply dropped.
    relocate 'javazoom', 'indi.etern.musichud.shaded.javazoom'
    exclude 'META-INF/services/javazoom.jl.player.AudioDeviceFactory'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

// Forge 1.20.1 discovers mixin configs through the `MixinConfigs` manifest attribute -- the
// `[[mixins]]` table in mods.toml is a NeoForge addition that Forge 47 does not read (the 1.20.x
// mods.toml reference lists no such key). Without this attribute the config is never registered and
// EVERY MusicHud mixin silently stays unapplied on Forge: vanilla/BiomeBeats music suppression, the
// HUD hook on the level-loading screen and the ModernUI span fix were all dead, while the same build
// behaved correctly on Fabric because fabric.mod.json declares the config there.
// The reference pack agrees on the convention: 272 of its 460 jars declare a `MixinConfigs`
// attribute (`MixinConfigs: lost_beats.mixins.json, lost_beats.client.mixins.json`), only 4 use the
// mods.toml table. Consequence to remember: this defect is invisible to `:forge:runClient` (the dev
// classpath has no manifest), so the mixins can only be verified from a packaged jar.
tasks.withType(Jar).configureEach {
    manifest {
        attributes 'MixinConfigs': 'music_hud.mixins.json'
    }
}

loom {
    runs {
        client {
            setRunDirectory file("run/client")
            jvmArguments.addAll(
                    "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
                    "-Dmusichud.log.level=DEBUG"
            )
        }
        server {
            setRunDirectory file("run/server")
            jvmArguments.addAll(
                    "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
                    "-Dmusichud.log.level=DEBUG"
            )
        }
    }
}
