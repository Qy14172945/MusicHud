# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx16G
org.gradle.parallel=true

# Mod properties
# Independent project: version numbering restarted at 0.1.0 and no longer tracks upstream.
mod_version = 0.1.1

minecraft_version_range = 1.20.1
maven_group = indi.etern.musichud
archives_name = music_hud
architectury_enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version = 1.20.1

# Mod dependencies
# Common
modernui_version=3.12.0

# Fabric
# Fabric API 0.92.12+1.20.1 declares `fabricloader >=0.16.10` in its metadata, so the loader
# must be at least that version or Fabric rejects the whole mod set with HARD_DEP_NO_CANDIDATE.
fabric_loader_version = 0.16.10

fabric_api_version = 0.92.12+1.20.1

modmenu_version = 7.2.2

forge_config_api_port_version = 8.0.3

cloth_config_version = 11.1.136

# Forge
forge_version = 47.1.37

# Library dependencies
lombok_version = 1.18.42
junit_version = 5.10.2
jlayer_version = 1.0.3
jflac_version = 1.5.2
dbus_version = 5.2.0
